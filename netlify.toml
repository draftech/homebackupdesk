# Working production host we brand toward: https://thehomebackup.com
# Domain is not purchased from this repo — connect it in the Netlify UI later.
# Canonical URLs are emitted from src/site.json (`url`).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Do not HTML-process publish files (pretty URLs / snippet injection).
[build.processing]
  skip_processing = true
[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"

# Edge function owns GET /sitemap.xml at the CDN (bypasses static XML 500s).
[[edge_functions]]
  function = "sitemap"
  path = "/sitemap.xml"

[[edge_functions]]
  function = "sitemap"
  path = "/sitemap.xml/"

# Serverless fallback if edge is unavailable. force=true so a site-level
# sitemap plugin or static *.xml pipeline cannot intercept the path.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/serve-sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml/"
  to = "/.netlify/functions/serve-sitemap"
  status = 200
  force = true

# Affiliate hops: swap `to` with real tracking URLs in this file (and src/affiliates.json).
# Keep `from` slugs stable. 302 so you can change destinations later without caching 301s.
[[redirects]]
  from = "/go/jackery"
  to = "https://www.jackery.com/"
  status = 302
  force = true

[[redirects]]
  from = "/go/jackery/"
  to = "https://www.jackery.com/"
  status = 302
  force = true

[[redirects]]
  from = "/go/bluetti"
  to = "https://www.bluettipower.com/"
  status = 302
  force = true

[[redirects]]
  from = "/go/bluetti/"
  to = "https://www.bluettipower.com/"
  status = 302
  force = true

[[redirects]]
  from = "/go/anker-solix"
  to = "https://www.ankersolix.com/"
  status = 302
  force = true

[[redirects]]
  from = "/go/anker-solix/"
  to = "https://www.ankersolix.com/"
  status = 302
  force = true

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
