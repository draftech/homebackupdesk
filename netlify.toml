# Working production host we brand toward: https://thehomebackup.com
# Domain is not purchased from this repo — connect it in the Netlify UI later.
# Canonical URLs are emitted from src/site.json (`url`).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Snippet injection / pretty-URL post-processing can 500 on sitemap.xml
# (robots.txt is text/plain and is skipped). Serve files as published.
[build.processing]
  skip_processing = true

# Static sitemap from dist/seo/sitemap.xml. force=true so this rewrite
# wins over a splat 404 or any Netlify sitemap plugin on /sitemap.xml.
[[redirects]]
  from = "/sitemap.xml"
  to = "/seo/sitemap.xml"
  status = 200
  force = true

# Affiliate hops: swap `to` with real tracking URLs in this file (and src/affiliates.json).
# Keep `from` slugs stable. 302 so you can change destinations later without caching 301s.
[[redirects]]
  from = "/go/jackery"
  to = "https://www.jackery.com/"
  status = 302
  force = true

[[redirects]]
  from = "/go/jackery/"
  to = "https://www.jackery.com/"
  status = 302
  force = true

[[redirects]]
  from = "/go/bluetti"
  to = "https://www.bluettipower.com/"
  status = 302
  force = true

[[redirects]]
  from = "/go/bluetti/"
  to = "https://www.bluettipower.com/"
  status = 302
  force = true

[[redirects]]
  from = "/go/anker-solix"
  to = "https://www.ankersolix.com/"
  status = 302
  force = true

[[redirects]]
  from = "/go/anker-solix/"
  to = "https://www.ankersolix.com/"
  status = 302
  force = true

# Unknown paths use dist/404.html automatically. Do not splat /* to 404 —
# that rule can 500 /sitemap.xml when shadowing misses XML.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/seo/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
